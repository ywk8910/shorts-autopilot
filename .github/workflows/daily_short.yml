name: daily-short

on:
  schedule:
    - cron: "0 21 * * *"      # 매일 06:00 KST (UTC 전날 21:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 업로드 없이 영상만 생성 (Artifacts로 다운로드)"
        default: "false"
      force:
        description: "true면 하루 상한·게시 기준(z, 변동률, 연속)을 무시하고 강제 생성 — 테스트용"
        default: "false"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps (ffmpeg, Korean font)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Generate & upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_WEBHOOK_URL: ${{ secrets.KAKAO_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "args:$ARGS"
          python -m shorts.main $ARGS

      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit state
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: state $(date -u +%F)"
          git push
