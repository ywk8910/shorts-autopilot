name: daily-short

on:
  schedule:
    - cron: "0 21 * * *"      # 매일 06:00 KST (UTC 전날 21:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 업로드 없이 영상만 생성 (Artifacts로 다운로드)"
        default: "false"
      force:
        description: "true면 하루 상한·게시 기준(z, 변동률, 연속)을 무시하고 강제 생성 — 테스트용"
        default: "false"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps (ffmpeg, Korean font)
        timeout-minutes: 12
        run: |
          # apt 미러가 멈춰 30분 잡 타임아웃으로 통째로 날아간 실행이 있었다(10/31, 11/7).
          # ffmpeg과 한글 폰트는 러너 이미지에 이미 들어 있는 날이 많으니, 있으면 apt를 건너뛴다.
          # 정말 설치가 필요한 날에만 받되, 한 번 멈췄다고 30분을 기다리지 않도록
          # 시도마다 시간을 끊고 세 번까지 다시 해 본다.
          need=""
          command -v ffmpeg >/dev/null 2>&1 || need="$need ffmpeg"
          fc-list :lang=ko 2>/dev/null | grep -qi noto || need="$need fonts-noto-cjk"
          if [ -z "$need" ]; then
            echo "ffmpeg·한글 폰트 모두 있음 — apt 건너뜀"
            exit 0
          fi
          echo "설치 필요:$need"
          for i in 1 2 3; do
            if timeout 120 sudo apt-get update -q \
               && timeout 240 sudo apt-get install -y -q $need; then
              exit 0
            fi
            echo "apt 실패 ($i/3) — 20초 후 재시도"
            sleep 20
          done
          echo "::error::apt 설치 실패 — ffmpeg/한글 폰트 없이는 진행할 수 없습니다"
          exit 1

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Generate & upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          KAKAO_WEBHOOK_URL: ${{ secrets.KAKAO_WEBHOOK_URL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "args:$ARGS"
          python -m shorts.main $ARGS

      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish video as a release (수동 업로드용 직접 링크)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mp4=$(ls out/*.mp4 2>/dev/null | head -n1 || true)
          if [ -z "$mp4" ]; then
            echo "오늘은 만든 영상이 없음 — Release 건너뜀"
            exit 0
          fi
          # 파일명은 2026-10-06_fx_jpykrw.mp4 꼴. 앞의 날짜가 그대로 태그가 된다.
          # shorts/main.py의 download_url()이 같은 규칙으로 링크를 미리 만들어 알림에 넣는다.
          tag="short-$(basename "$mp4" .mp4 | cut -d_ -f1)"
          notes=out/upload_note.md
          [ -f "$notes" ] || printf '%s\n' "$(basename "$mp4")" > "$notes"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$mp4" --title "$tag" --notes-file "$notes"
          echo "released: $tag"
          # 오래된 건 정리해서 Release 목록이 무한정 길어지지 않게 한다 (최근 14개 유지)
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^short-' | sort -r | tail -n +15 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true

      - name: Commit state
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: state $(date -u +%F)"
          git push
