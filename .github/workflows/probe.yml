name: probe-fx
# 임시 점검용. 실제 소스 코드로 7개 지표의 최신 데이터 날짜·값·대본용 날짜 표현을 확인한다. 확인이 끝나면 지운다.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance requests
      - name: probe
        shell: python
        run: |
          import os, sys, datetime as dt
          sys.path.insert(0, ".")
          from shorts.sources import fx_rates, market
          from shorts.insights import data_day
          from shorts.select_topic import zscore
          now = dt.datetime.now(dt.timezone.utc)
          out = [f"NOW KST {(now + dt.timedelta(hours=9)):%Y-%m-%d %H:%M}"]
          for mod in (fx_rates, market):
              try:
                  for t in mod.fetch():
                      s = t["series"]
                      out.append(f"{t['id']:11} 마지막 {s[-1][0]} {s[-1][1]:>10,.2f} | 직전 {s[-2][0]} {s[-2][1]:>10,.2f} | "
                                 f"{t['change_pct']:+6.2f}% z{zscore(t):.1f} | long {len(t['long'])}개 {t['long'][0][0]}~ | 대본 '{data_day(t)}'")
              except Exception as e:
                  out.append(f"{mod.__name__} ERR {type(e).__name__}: {e}")
          txt = "\n".join(out)
          print(txt)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```\n" + txt + "\n```\n")
